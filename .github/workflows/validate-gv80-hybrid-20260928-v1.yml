name: Validate GV80 Hybrid 20260928 v1
on:
  push:
    branches: [main]
    paths:
      - '_relay/gv80-hybrid-validate-20260928-v1/READY'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Download canonical source and publish bundle
        shell: bash
        env:
          SOURCE_B64: ''
          BUNDLE_B64: ''
        run: |
          set -euo pipefail
          SOURCE_URL="$(printf '%s' "$SOURCE_B64" | base64 -d)"
          BUNDLE_URL="$(printf '%s' "$BUNDLE_B64" | base64 -d)"
          curl --fail --location --silent --show-error "$SOURCE_URL" -o /tmp/source.zip
          curl --fail --location --silent --show-error "$BUNDLE_URL" -o /tmp/bundle.zip
          echo '1788b03dd30bfb50a7fcac2abd208e716f7bd5c4fb99ddbffffac93cc3936c73  /tmp/source.zip' | sha256sum -c -
          echo '2cbfec55e3f2b6f10787862853d40cb93c7748c4091f8f72ee166925a86caaca  /tmp/bundle.zip' | sha256sum -c -
          mkdir -p /tmp/source /tmp/bundle
          unzip -q /tmp/source.zip -d /tmp/source
          unzip -q /tmp/bundle.zip -d /tmp/bundle
      - name: Install validator dependencies
        run: python -m pip install --quiet pillow jsonschema
      - name: Run PATCH9 canonical final validator
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find /tmp/source -type f -path '*/TOOLS/validate_publish_bundle.py' -print -quit | xargs dirname | xargs dirname)"
          BUNDLE="$(find /tmp/bundle -type f -name article.html -print -quit | xargs dirname)"
          python "$ROOT/TOOLS/validate_publish_bundle.py" "$BUNDLE/article.html" --preview "$BUNDLE/article.preview.html" --asset-manifest "$BUNDLE/asset_manifest.json" --current-asset-set "$BUNDLE/current_asset_set.json" --receipt "$BUNDLE/validation_receipt.json" | tee "$BUNDLE/validation.log"
          grep -q 'CONVERGENCE_PASS=YES' "$BUNDLE/validation.log"
      - name: Upload validated publish bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: gv80-hybrid-validation-20260928-v1
          path: |
            /tmp/bundle/gv80_hybrid_render_bundle/validation_receipt.json
            /tmp/bundle/gv80_hybrid_render_bundle/validation.log
            /tmp/bundle/gv80_hybrid_render_bundle/article.html
            /tmp/bundle/gv80_hybrid_render_bundle/article.preview.html
            /tmp/bundle/gv80_hybrid_render_bundle/asset_manifest.json
            /tmp/bundle/gv80_hybrid_render_bundle/current_asset_set.json
