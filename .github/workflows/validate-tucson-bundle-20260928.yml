name: Validate Tucson October publish bundle
on:
  push:
    branches: [main]
    paths:
      - '2026-09/tucson-october-20260928/**'
      - 'scripts/validate_tucson_bundle_online.py'
      - '.github/workflows/validate-tucson-bundle-20260928.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validator dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow==12.3.0
      - name: Validate article preview and exact remote asset identity
        run: python scripts/validate_tucson_bundle_online.py
      - name: Commit manifest and validation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-09/tucson-october-20260928/asset_identity.json 2026-09/tucson-october-20260928/validation_report.txt
          if git diff --cached --quiet; then
            echo 'No validation output changes'
          else
            git commit -m 'Validate Tucson publish bundle [skip ci]'
            git push
          fi
