name: Import youth future savings preview asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-yfs-apply-v2-preview.yml'

permissions:
  contents: write

jobs:
  import-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download preview image
        run: |
          mkdir -p 20261007-youth-future-savings-apply-v2
          curl -L --fail --retry 2 'https://uc4eb384cd4439eb812df0906127.dl.dropboxusercontent.com/cd/0/get/DJgvedgxQFVj7w-zZk1JEGgx-q5dC1qLl3_IkH1A1e_keHlfrSjIUHqUAtl1MBbITTJ1o8p1x9mzJp0ISCeJjVKlLkp0DSWPzwVgYPGi7huMmJgTCOV67T5mq1iaECRbaqkUErjX5iL7tSuev2TttqshVUJpDEGfCcricgAakveQYA/file?c_luid=3565984f' -o 20261007-youth-future-savings-apply-v2/01-cover.png
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 20261007-youth-future-savings-apply-v2/01-cover.png
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add youth future savings application preview cover"
            git pull --rebase origin main
            git push origin main
          fi
