name: Build Tucson HQ render and copy preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tucson-hq-render-20260928.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build HQ article, embedded preview and identity manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, re
          old=Path('2026-09/tucson-october-20260928')
          out=Path('2026-09/tucson-october-hq-20260928')
          out.mkdir(parents=True,exist_ok=True)
          repls={
          'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-20260928/01-homefeed-tucson-october.jpg':'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-hq-20260928/01-homefeed-tucson-hq.jpg',
          'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-20260928/02-space-packaging.jpg':'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-hq-20260928/02-space-packaging-hq.jpg',
          'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-20260928/03-powertrain.jpg':'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-hq-20260928/03-powertrain-hq.jpg',
          'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-20260928/04-digital-safety.jpg':'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-hq-20260928/04-digital-cockpit-hq.jpg',
          'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-20260928/05-price-decision.jpg':'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-hq-20260928/05-safety-decision-hq.jpg'}
          article=(old/'article.html').read_text(encoding='utf-8')
          for a,b in repls.items(): article=article.replace(a,b)
          (out/'article.html').write_text(article,encoding='utf-8')
          article_sha=hashlib.sha256((out/'article.html').read_bytes()).hexdigest()
          preview=(old/'article.preview.html').read_text(encoding='utf-8')
          for a,b in repls.items(): preview=preview.replace(a,b)
          preview=re.sub(r'<meta name="naver-article-sha256" content="[0-9a-f]+">',f'<meta name="naver-article-sha256" content="{article_sha}">',preview)
          start=preview.index('<div id="naverArticle" tabindex="-1">')+len('<div id="naverArticle" tabindex="-1">')
          marker='\n</div>\n</div>\n<script>'
          end=preview.rindex(marker)
          preview=preview[:start]+'\n'+article+'\n'+preview[end:]
          (out/'article.preview.html').write_text(preview,encoding='utf-8')
          names=['01-homefeed-tucson-hq.jpg','02-space-packaging-hq.jpg','03-powertrain-hq.jpg','04-digital-cockpit-hq.jpg','05-safety-decision-hq.jpg']
          roles=['01-homefeed','02-space-packaging','03-powertrain','04-digital-cockpit','05-safety-decision']
          expected=['1a30b42b36b574e9969e6bf5dcb386de16db8d78f3b5acb59fd81954a91ff7b4','89c1caa8802a3e8cccc4b0259e7fd4ba1583a57263898f96bfb67e5272a303c1','1ab8de6c2850ebb4ef119df83e03a67df4089201e58515fe6e36fde61d433e07','27045bd58934a0aeb96648f9b34b5ae94fb047bb36a0a776c382b20349ecb591','f1d5a9f2c644c4fe3c377ad0f56266c6e522821c65cb34d28c987b1f536c5e52']
          blobs=['f46daf04cdbf9d9620f7d59950dbd1dd8a9d4277','1ec135b8b64d2eb856506546c316da05695be2c9','d629f77266cd668a1acc2bc428ed6321cf7a4e43','a34e9e5e451a3310783c7a5f1fc2f8caa0ff7753','cba3405ec936cccdf2c0cabc12013517e4b4e491']
          assets=[]; report=[]
          for i,(n,r,sha,blob) in enumerate(zip(names,roles,expected,blobs),1):
              p=out/n; got=hashlib.sha256(p.read_bytes()).hexdigest(); assert got==sha,(n,got,sha)
              w,h=Image.open(p).size; assert w>=1200 and h>=675 and 1.55<=w/h<=1.90,(n,w,h)
              url=f'https://raw.githubusercontent.com/qltlf001-creator/naver-blog-images/main/2026-09/tucson-october-hq-20260928/{n}'
              assets.append({'role':r,'authoritative_original':f'./{n}','sha256':sha,'download_url':url,'github_blob_sha':blob})
              report.append(f'PASS asset {i}: SHA256={sha} size={p.stat().st_size} dimensions={w}x{h}')
          manifest={'schema':'NAVER_ASSET_IDENTITY_MANIFEST_V1','article_html':'./article.html','preview_html':'./article.preview.html','assets':assets}
          (out/'asset_identity.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          urls=[a['download_url'] for a in assets]
          assert article.count('<img ')==5
          assert all(article.count(u)==1 for u in urls)
          assert preview.count('id="copyBodyBtn"')==1 and preview.count('id="selectBodyBtn"')==1 and preview.count('id="copyTitleBtn"')==1
          assert "selectNodeContents(article)" in preview and "execCommand('copy')" in preview
          assert f'name="naver-article-sha256" content="{article_sha}"' in preview
          report += [f'PASS article SHA256 binding: {article_sha}','PASS exactly 5 HQ GitHub image URLs in article','PASS embedded preview copy toolbar and selection fallback','GOLDEN_HQ_RENDER_BUILD=PASS']
          (out/'validation_report_hq.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY
      - name: Commit HQ render bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026-09/tucson-october-hq-20260928/article.html 2026-09/tucson-october-hq-20260928/article.preview.html 2026-09/tucson-october-hq-20260928/asset_identity.json 2026-09/tucson-october-hq-20260928/validation_report_hq.txt
          git commit -m 'Build Tucson HQ render bundle [skip ci]'
          git push
