name: Import youth future savings apply v3 render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-yfs-apply-v3-render.yml'

permissions:
  contents: write

jobs:
  import-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download render copy from Dropbox
        run: |
          set -euo pipefail
          mkdir -p 20261007-youth-future-savings-apply-v3
          curl -L --fail --retry 2 'https://ucfa51485622dd62b0df52215f6c.dl.dropboxusercontent.com/cd/0/get/DJi-h00w1BFONcm3IDq4zojOLvjhR4BOPlO6yqITnxovtaSerInOJFnMhzgt1D6GARALTGR6RIva5Fci_ZXm7yC-cGHLINnCvJ4f8mOwnPQter5s1Q8iCKIVnzZ3_HaWBhz2bNQMsjJLA_MeJkflKqxeiS4yhbb5it8nkBYJ3OUWrA/file?c_luid=3565984f' -o 20261007-youth-future-savings-apply-v3/render-copy.html
      - name: Commit render copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 20261007-youth-future-savings-apply-v3/render-copy.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add youth future savings apply v3 render copy"
            git push
          fi
