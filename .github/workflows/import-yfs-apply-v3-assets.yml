          curl -L --fail --retry 2 'https://uce46f498b6d9aed9e0f23993b88.dl.dropboxusercontent.com/cd/0/get/DJjLKhDszmsh-WskU2OtMedM8M1_wuFvDlKgcH8mtKgOA_ZCoAjrfjJVQvRtqSIyhj18nJfYO3gKmuVQifLGUru5cd0LmQ0P-wxz7rw0TJQyHsmnY35pXU9XTS128KfEZlsKTALgYtsMnbhobEXyLXiXGbxZcl5CUsmZT_J4111DhA/file?c_luid=3565984f' -o 20261007-youth-future-savings-apply-v3/04-process.png
