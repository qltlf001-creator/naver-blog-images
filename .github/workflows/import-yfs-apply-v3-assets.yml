name: Import youth future savings apply v3 assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-yfs-apply-v3-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated assets from Dropbox
        run: |
          set -euo pipefail
          mkdir -p 20261007-youth-future-savings-apply-v3
          curl -L --fail --retry 2 'https://uc9f6c154766157429efaaf24d37.dl.dropboxusercontent.com/cd/0/get/DJhBIfbJDcvKvYKPFmeQK9y9kDShFlK9QNDwdQj3X3Gk_Hx-ycUnqUmIvvICdE3kJYTsiI-9O-6r5WTuKxobnVzWOIblHEE4wfs6imK4uyW_3cECzDrezzo5RrG_2_z_lsJH9B4j49Vl659bzf9jJ19Yu4bAbksxNPJikz0uRnwD2A/file?c_luid=3565984f' -o 20261007-youth-future-savings-apply-v3/01-cover.png
