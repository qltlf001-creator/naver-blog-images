      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 20261007-youth-future-savings-apply-v3/*.png
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add youth future savings apply v3 assets"
            git push
          fi
