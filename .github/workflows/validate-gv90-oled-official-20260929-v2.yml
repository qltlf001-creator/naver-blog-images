name: Validate GV90 OLED official V2 PATCH10 convergence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-gv90-oled-official-20260929-v2.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download canonical source plus finalized V2 run bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 20 'https://uc55f5eb124b9176c1ac1750ee2c.dl.dropboxusercontent.com/cd/0/get/DJAZVZ2ZNMXI3yIxTX6uXJFbzQj87fv4BNuK3DD6W7s9Sdsiw-4welO1sxsm8bxCjCXH7BeSOq3gCl-W-zCxNP_vgzxaMHmkHlZ2s3eC3SM6zLagjxNh0TWjOYz2b8di0FNRsLO6zdhP5Lh2ezkw07tYzOACojDNsMWvXtegLuv_mQ/file?c_luid=3565984f' -o validation-pack.zip
          echo 'a3922f8e6b8fc7116a6dd60a18ebb7f6569591f29ccfb6bfc2fd8c89634fe345  validation-pack.zip' | sha256sum -c -
          rm -rf .validation-work
          mkdir -p .validation-work/pack .validation-work/src
          unzip -q validation-pack.zip -d .validation-work/pack
          unzip -q .validation-work/pack/source.zip -d .validation-work/src
      - name: Install validator runtime dependencies
        run: python -m pip install --quiet pillow jsonschema
      - name: Run canonical PATCH10 live publish-bundle validator
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(dirname "$(find .validation-work/src -type f -name 00_READ_FIRST_PROJECT_EXECUTION_GATE.md | head -1)")
          test -n "$ROOT"
          RUN="$GITHUB_WORKSPACE/.validation-work/pack/run"
          mkdir -p "$GITHUB_WORKSPACE/validation-receipts/gv90-oled-official-20260929-v2"
          python "$ROOT/TOOLS/validate_publish_bundle.py" "$RUN/article.html" \
            --preview "$RUN/article.preview.html" \
            --asset-manifest "$RUN/asset_identity.json" \
            --current-asset-set "$RUN/current_asset_set.json" \
            --receipt "$GITHUB_WORKSPACE/validation-receipts/gv90-oled-official-20260929-v2/publish_validation_receipt.json" \
            | tee "$GITHUB_WORKSPACE/validation-receipts/gv90-oled-official-20260929-v2/validation.log"
      - name: Commit PASS receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qltlf001-creator'
          git config user.email 'qltlf001@gmail.com'
          git add validation-receipts/gv90-oled-official-20260929-v2
          if git diff --cached --quiet; then
            echo 'NOOP_SUCCESS: validation receipt already current'
          else
            git commit -m 'Record GV90 official V2 PATCH10 convergence PASS [skip ci]'
            git push origin main
          fi
