name: Transfer approved sports assets from Dropbox (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sports_20261009_dropbox_transfer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and download approved original PNG files
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, urllib.request
          folder=Path("sports/2026-10-09")
          manifest=json.loads((folder/"asset_manifest_APPROVED.json").read_text(encoding="utf-8"))
          urls=json.loads(r"""{
            "kbo_01_cover.png": "https://uccc69e635865382f89973dabaee.dl.dropboxusercontent.com/cd/0/get/DJpeJs6s3f7NY8g4UWyXpcddZADE4KjffK1EzxWyZFjQhJ9KbAypjgov6JXAjraYbKdBSxVJBtF3UAY-xIOGp-LREI92yi6V2F3lls7WoZcUQalOTYZwmtuNGX5IeZU0ySAS_cKr6mPiefPLM_GU0JLeMns44eCFPFHN1X_ycbiJ6g/file?c_luid=3565984f",
            "kbo_02_home.png": "https://uc9760a9e3195fe69cc691933aaa.dl.dropboxusercontent.com/cd/0/get/DJpmimWsxD8X6sBcIoGvbpyjF5LYnD0VKtZCLYX2VVIh6-3RP-RgUE6KVVEsgsOJaHxbb5dNBFjmH71rQfSSmZCf135OOGKI3RPpGb7D8ji-h2I4p5gslt8P8KpH3Y8fYM8KAKlYFJRyc2_RFm8idnOznb4Lbk017O5TPTzDVcYMlw/file?c_luid=3565984f",
            "kbo_03_bracket.png": "https://uca9f9741816662c06e053a91d80.dl.dropboxusercontent.com/cd/0/get/DJrlCwi7XSsb5QMF289OtM9rHIFpKy7oZFNDmlEUinKE7ZeHD4LR0lw4reWxgC1udRbPgDY_R48kJdtzBM7dcOl5Zlprn5E-OH68FYpb2hv3wW-ku3mN7MxVK9c1apfaJU3AdSE-iGVCtfH-araeqcPmCKC49Ig5-l4asBhnLEh9VA/file?c_luid=3565984f",
            "dodgers_01_cover.png": "https://uc2984da1dda466808670498f6f8.dl.dropboxusercontent.com/cd/0/get/DJoDOtezKzG8St9CGPgP9OP9GNKIqLqCrGGkpB3a2R2xssYzMM__Q5IkJGI_IQrxYpMxs8uoM3GQUCefHf5zYrGPvfaBRE5EGEaE7VyiogcjNW_B1NqBnWjEyXTGqkQLaxewSg8Mf1q5RTJ3hUC_9okhSeqvC34ut3nAav9IJqEQTQ/file?c_luid=3565984f",
            "dodgers_02_7th.png": "https://ucebb3aade9ded3e9e88c95c90da.dl.dropboxusercontent.com/cd/0/get/DJpMGPlazpAretqBHLpT3DZX4GIHq_OeIdXfWOwCwT-gNhRnTVhYoipcI1YoHzLe9PBTQtLKi1kJzQ0RocY057rUn6XcaUv0bMYAiQ0nmMWpkTtPPnqUblnsMTA0Sfy4iIh1OOHq4-7AqqOZdLuIQGpzu1AFp__8QEyF9t01kKDXYw/file?c_luid=3565984f",
            "dodgers_03_next.png": "https://uce3e43637328134195000f26471.dl.dropboxusercontent.com/cd/0/get/DJp8qJ2RESeQMpMhz6eCKmZoYWzFckiU-Gm3_B9bwd1XpPP4KOvD5sJEdgyNKAyYh2zlt4fT5gCSTyf6fcBZhN0Rg5UxlioR7RqRK6M1Uv46aKhsC0G4kYrCVle93Bwi9VyICdSjZ_htDuyTAELrodJifNDh0Hh9MsneDKUyZd562w/file?c_luid=3565984f",
            "golf_01_cover.png": "https://ucf9b97523119fb8db5a72c36550.dl.dropboxusercontent.com/cd/0/get/DJqnleRFDevtZClaqyKDZ01zgUaYKn4K-tcgJKF_uPza0XBUStX7QyX71Oo-6RRlgboGOoDGu9pk-hNUPLlCuPzbkhi48fl3q71HRXMVnbtdGJ7T-gyGEHB9iONPeOBQ_UGm_dvupiNFNC3WHTso7-prhgfiz_WBKgOyR-ptDI8Apg/file?c_luid=3565984f",
            "golf_02_scoring.png": "https://uc39de0c9ec1d1964b7c6c3e45ac.dl.dropboxusercontent.com/cd/0/get/DJqap6brNhDznudeOO-l1cpxYCq9mgpUM7aHoW0zJfPuZOPdi0aJdv_PqxRP0-WffP92bZHmRQQQUvpV5IvP9cUGIOZndyiTPSGCqFvIGZ3dEPEge_CY1Md3lJv5NCJe3gGpiPcFoSIRbMpNWWXmQ81_6nhgIigES_vUmVZGKluYog/file?c_luid=3565984f",
            "golf_03_15points.png": "https://ucac14d1b6afa672c582ec00dde4.dl.dropboxusercontent.com/cd/0/get/DJq4l8C5PrSe8WgW1rENrvnPQCwe53eqtym2OikCpkc-SkWuVuB70vn4ifgCaMGdBI8pTjnSW5OdbWTrEAQJARQY_ErOoSz6Aew8jrOsIQ76xhiw29_wXDuLKAiOgmPSIn-bgpieYhEuqoSwI2ngMzVPLPGuULDiMHESTYRlXnCDWA/file?c_luid=3565984f"
          }""")
          assets=manifest["assets"]
          assert len(assets)==len(urls)==9
          for rec in assets:
              name=rec["filename"]
              dest=folder/name
              if dest.exists():
                  b=dest.read_bytes()
                  if len(b)==rec["bytes"] and hashlib.sha256(b).hexdigest()==rec["sha256"]:
                      print("VERIFIED_EXISTING",name)
                      continue
                  raise RuntimeError("Different GitHub bytes already present: "+name)
              req=urllib.request.Request(urls[name],headers={"User-Agent":"sports-assets-approved-import/1.0"})
              with urllib.request.urlopen(req,timeout=120) as response:
                  b=response.read()
              actual=hashlib.sha256(b).hexdigest()
              if len(b)!=rec["bytes"] or actual!=rec["sha256"]:
                  raise RuntimeError("Mismatch from Dropbox transfer "+name)
              dest.write_bytes(b)
              print("UPLOADED_BINARY_READY",name,len(b),actual)
          print("PASS: all 9 approved original images")
          PY
      - name: Commit verified approved PNG bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports/2026-10-09/*.png
          if git diff --cached --quiet; then echo "Already uploaded"; exit 0; fi
          git commit -m "Upload nine user-approved sports PNG images (original bytes)"
          git push origin HEAD:main
