name: Publish Ganwoljae approved assets 20261008

on:
  push:
    branches: [main]
    paths:
      - '_relay/ganwoljae-20261008/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Download and verify exact approved assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          manifest = json.load(open('_relay/ganwoljae-20261008/manifest.json', encoding='utf-8'))
          outdir = pathlib.Path('20261008-ganwoljae-hiking-v1')
          outdir.mkdir(parents=True, exist_ok=True)
          for a in manifest['assets']:
              req = urllib.request.Request(a['url'], headers={'User-Agent':'GanwoljaeAssetRelay/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read(a['size'] + 1)
              if len(data) != a['size']:
                  raise SystemExit(f"size mismatch: {a['name']}")
              if hashlib.sha256(data).hexdigest() != a['sha256']:
                  raise SystemExit(f"sha mismatch: {a['name']}")
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f"not png: {a['name']}")
              (outdir / a['name']).write_bytes(data)
          PY
      - name: Commit verified PNG assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 20261008-ganwoljae-hiking-v1
          git rm -r _relay/ganwoljae-20261008
          git commit -m 'Publish verified Ganwoljae approved assets'
          git push origin HEAD:main
