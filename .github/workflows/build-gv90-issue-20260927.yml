name: Build GV90 current issue visuals

on:
  push:
    paths:
      - '.github/workflows/build-gv90-issue-20260927.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow requests
      - name: Build visuals
        run: |
          cat > /tmp/build.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import requests, io, os

          OUT = Path('2026-09/gv90-current-issue')
          OUT.mkdir(parents=True, exist_ok=True)
          W,H = 1200,675
          GOLD=(231,185,92); GOLD2=(255,221,141); WHITE=(248,248,246); MUTED=(210,214,220); BLACK=(8,10,14); NAVY=(12,17,28)
          font_path='/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          reg_path='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'
          def F(size,bold=True): return ImageFont.truetype(font_path if bold else reg_path,size)
          def get(url):
              r=requests.get(url,timeout=40); r.raise_for_status(); return Image.open(io.BytesIO(r.content)).convert('RGB')
          def fit(im,w,h):
              s=max(w/im.width,h/im.height); im=im.resize((int(im.width*s),int(im.height*s)),Image.Resampling.LANCZOS)
              l=(im.width-w)//2; t=(im.height-h)//2; return im.crop((l,t,l+w,t+h))
          def round_mask(size,r=28):
              m=Image.new('L',size,0); d=ImageDraw.Draw(m); d.rounded_rectangle((0,0,size[0],size[1]),r,fill=255); return m
          def gradient_overlay(img, left=220, right=0):
              ov=Image.new('RGBA',(W,H),(0,0,0,0)); px=ov.load()
              for x in range(W):
                  a=int(left+(right-left)*x/(W-1))
                  for y in range(H): px[x,y]=(5,8,14,max(0,min(255,a)))
              return Image.alpha_composite(img.convert('RGBA'),ov)
          def text(draw,xy,s,size,color=WHITE,anchor=None): draw.text(xy,s,font=F(size),fill=color,anchor=anchor,stroke_width=1,stroke_fill=(0,0,0))
          def pill(draw, box, label, fill=(10,12,18,210), outline=GOLD):
              draw.rounded_rectangle(box,18,fill=fill,outline=outline,width=2)
              draw.text(((box[0]+box[2])//2,(box[1]+box[3])//2),label,font=F(26),fill=WHITE,anchor='mm')

          urls={
            'side':'https://www.hyundaimotorgroup.com/image/upload/asset_library/MDA00000000000083312/b6320b442e5141fcbe856f3b54ae5ac2.jpg',
            'green':'https://www.hyundaimotorgroup.com/image/upload/asset_library/MDA00000000000083342/c4003b344d924eebbb11b9961e7b5c79.jpg',
            'exec':'https://www.hyundaimotorgroup.com/image/upload/asset_library/MDA00000000000083343/80ccb250233f4097a3deb7fdd6ed9b42.jpg',
            'wide':'https://www.hyundaimotorgroup.com/image/upload/asset_library/MDA00000000000083346/93f6b8f8887e486389dc3dbe6309da93.jpg',
          }
          side=get(urls['side']); green=get(urls['green']); ex=get(urls['exec']); wide=get(urls['wide'])

          # 01 HERO
          bg=fit(side,W,H)
          bg=gradient_overlay(bg,235,30)
          d=ImageDraw.Draw(bg)
          d.text((62,54),'GENESIS',font=F(28),fill=WHITE)
          d.line((62,96,430,96),fill=(190,190,190),width=2)
          d.text((60,128),'GV90',font=F(105),fill=WHITE,stroke_width=2,stroke_fill=(0,0,0))
          d.text((60,238),'출시일',font=F(76),fill=GOLD2,stroke_width=2,stroke_fill=(0,0,0))
          d.text((60,332),'공개 전, 먼저 볼 5가지',font=F(43),fill=WHITE)
          pill(d,(62,425,360,488),'국내 첫 공개 전시 오늘 종료')
          pill(d,(62,505,303,568),'123.5kWh · 약 500km')
          d.text((62,598),'가격보다 중요한 건 “구성”입니다',font=F(30),fill=GOLD2)
          bg.convert('RGB').save(OUT/'01-homefeed.jpg',quality=92,optimize=True)

          # 02 numbers card
          base=Image.new('RGB',(W,H),NAVY)
          photo=fit(green,520,675); base.paste(photo,(680,0))
          ov=Image.new('RGBA',(W,H),(0,0,0,0)); od=ImageDraw.Draw(ov); od.rectangle((0,0,760,H),fill=(8,10,16,244)); base=Image.alpha_composite(base.convert('RGBA'),ov)
          d=ImageDraw.Draw(base)
          d.text((60,54),'GV90 핵심 숫자',font=F(52),fill=WHITE)
          d.text((60,120),'“500km” 하나만 보면 놓치는 것들',font=F(31),fill=GOLD2)
          items=[('123.5','kWh','현대차그룹 전기차 최대 배터리 용량'),('490','kW','전·후륜 합산 최고출력'),('800','Nm','합산 최대토크'),('22','분','350kW 급속충전 10→80%')]
          y=198
          for n,u,desc in items:
              d.rounded_rectangle((58,y,635,y+88),18,fill=(20,24,34),outline=(90,90,100),width=1)
              d.text((82,y+12),n,font=F(48),fill=GOLD2)
              d.text((245,y+25),u,font=F(25),fill=WHITE)
              d.text((330,y+28),desc,font=F(22,False),fill=MUTED)
              y+=103
          d.text((60,620),'※ 주행거리 약 500km는 GV90 7인승 연구소 측정 기준',font=F(20,False),fill=(180,185,195))
          base.convert('RGB').save(OUT/'02-numbers.jpg',quality=92,optimize=True)

          # 03 arch gate
          base=Image.new('RGB',(W,H),BLACK)
          # stylized coach-door diagram, avoids using non-official car photo
          d=ImageDraw.Draw(base)
          d.text((60,50),'네오룬 아치 게이트',font=F(55),fill=WHITE)
          d.text((60,120),'B필러를 없애고, 앞·뒤 문을 서로 마주 보게 열다',font=F(30),fill=GOLD2)
          # vehicle silhouette diagram
          d.rounded_rectangle((115,260,1085,480),45,fill=(24,28,36),outline=(120,125,135),width=3)
          d.line((600,270,600,468),fill=(90,90,95),width=3)
          # open doors
          d.polygon([(560,275),(420,190),(395,215),(520,340)],fill=(70,76,88),outline=GOLD)
          d.polygon([(640,275),(785,190),(812,215),(680,340)],fill=(70,76,88),outline=GOLD)
          d.arc((175,400,330,555),0,180,fill=WHITE,width=6); d.arc((870,400,1025,555),0,180,fill=WHITE,width=6)
          d.line((600,245,600,500),fill=GOLD2,width=3)
          d.text((600,360),'B필러 없음',font=F(30),fill=GOLD2,anchor='mm')
          d.text((180,565),'독립 개폐형',font=F(26),fill=WHITE)
          d.text((430,565),'듀얼 모션 힌지',font=F(26),fill=WHITE)
          d.text((765,565),'넓은 승하차 공간',font=F(26),fill=WHITE)
          d.text((60,628),'세계 최초 적용 · GV90 네오룬',font=F(22),fill=(185,190,198))
          base.save(OUT/'03-arch-gate.jpg',quality=92,optimize=True)

          # 04 interior tech
          base=fit(ex,W,H)
          ov=Image.new('RGBA',(W,H),(0,0,0,0)); od=ImageDraw.Draw(ov); od.rectangle((0,0,W,H),fill=(0,0,0,105)); od.rounded_rectangle((45,45,600,625),30,fill=(8,10,16,220),outline=GOLD,width=2)
          base=Image.alpha_composite(base.convert('RGBA'),ov); d=ImageDraw.Draw(base)
          d.text((82,78),'차 안이 “라운지”가 되는 이유',font=F(43),fill=WHITE)
          d.text((82,158),'24.6인치',font=F(62),fill=GOLD2); d.text((82,225),'팝업 OLED 시네마틱 디스플레이',font=F(25),fill=WHITE)
          d.text((82,296),'180°',font=F(62),fill=GOLD2); d.text((82,365),'전동식 스위블링 1열 시트',font=F(25),fill=WHITE)
          d.text((82,438),'25개',font=F(62),fill=GOLD2); d.text((82,507),'뱅앤올룹슨 프리미어 3D 스피커',font=F(25),fill=WHITE)
          d.text((82,576),'“주행”보다 머무는 시간까지 설계',font=F(24),fill=(210,214,220))
          base.convert('RGB').save(OUT/'04-lounge-tech.jpg',quality=92,optimize=True)

          # 05 checklist
          base=fit(side,W,H); base=gradient_overlay(base,245,105); d=ImageDraw.Draw(base)
          d.text((60,50),'출시 전 체크포인트',font=F(56),fill=WHITE)
          d.text((60,120),'지금은 ‘가격표’보다 이것부터 확인',font=F(32),fill=GOLD2)
          checks=[('01','정확한 국내 판매 개시일'),('02','공식 가격과 네오룬 가격 차이'),('03','정부 인증 1회 충전 주행거리'),('04','7인승·네오룬·퍼스트 에디션 구성')]
          y=205
          for no,lab in checks:
              d.rounded_rectangle((60,y,650,y+78),16,fill=(7,9,14,220),outline=(118,96,48),width=2)
              d.text((85,y+18),no,font=F(30),fill=GOLD2)
              d.text((160,y+20),lab,font=F(25),fill=WHITE)
              y+=96
          d.text((60,600),'국내 첫 특별 전시: 9/11~9/27 · 제네시스 수지',font=F(23),fill=(220,222,226))
          base.convert('RGB').save(OUT/'05-checkpoints.jpg',quality=92,optimize=True)
          PY
          python /tmp/build.py
      - name: Commit generated visuals
        run: |
          git config user.name 'qltlf001-creator'
          git config user.email 'qltlf001@gmail.com'
          git add 2026-09/gv90-current-issue/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add GV90 current issue blog visuals'
          git push
