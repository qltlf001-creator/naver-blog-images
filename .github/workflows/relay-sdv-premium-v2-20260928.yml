name: Relay SDV premium v2 images
on:
  push:
    branches: [main]
    paths:
      - '_relay/sdv-premium-v2/READY'
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download premium SDV images from Dropbox and verify SHA256
        shell: bash
        env:
          U1B64: ''
          U2B64: ''
          U3B64: ''
          U4B64: ''
          U5B64: ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdv-premium-v2 2026-09/hyundai-kia-sdv-premium-v2
          U1="$(printf '%s' "$U1B64" | base64 -d)"
          U2="$(printf '%s' "$U2B64" | base64 -d)"
          U3="$(printf '%s' "$U3B64" | base64 -d)"
          U4="$(printf '%s' "$U4B64" | base64 -d)"
          U5="$(printf '%s' "$U5B64" | base64 -d)"
          curl --fail --location --silent --show-error "$U1" -o /tmp/sdv-premium-v2/01-homefeed.png
          echo '67da4b6354bac97c026569f00723293ec917f6dc1ad45c6c8ffe6ed6294d1b0b  /tmp/sdv-premium-v2/01-homefeed.png' | sha256sum -c -
          curl --fail --location --silent --show-error "$U2" -o /tmp/sdv-premium-v2/02-core-number.png
          echo '260cb1422736ec9e3b959a77b1410a78d5f5f9a15f11de057c1af936c645a014  /tmp/sdv-premium-v2/02-core-number.png' | sha256sum -c -
          curl --fail --location --silent --show-error "$U3" -o /tmp/sdv-premium-v2/03-platform.png
          echo 'f8178bcd10b7a44fb5196ffdbbfb67137befcd6595bec90f951d6e086b1aac6e  /tmp/sdv-premium-v2/03-platform.png' | sha256sum -c -
          curl --fail --location --silent --show-error "$U4" -o /tmp/sdv-premium-v2/04-usability.png
          echo 'b29ab0f917f55436cde8b3e4892cd56f04606a665efdadf5d1a96ed95e9fbe87  /tmp/sdv-premium-v2/04-usability.png' | sha256sum -c -
          curl --fail --location --silent --show-error "$U5" -o /tmp/sdv-premium-v2/05-conclusion.png
          echo '443694aa1f0b77b4bab51161d4ebaee2eaf47c100a9d9ace1522355a89b884cc  /tmp/sdv-premium-v2/05-conclusion.png' | sha256sum -c -
          cp /tmp/sdv-premium-v2/*.png 2026-09/hyundai-kia-sdv-premium-v2/
      - name: Commit premium images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qltlf001-creator'
          git config user.email 'qltlf001@gmail.com'
          git add 2026-09/hyundai-kia-sdv-premium-v2
          git rm -f _relay/sdv-premium-v2/READY
          git commit -m 'Publish premium SDV visual set v2'
          git push
