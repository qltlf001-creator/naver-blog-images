name: Build GV80 Master V6 Final
on:
  push:
    branches: [main]
    paths:
      - '_trigger/gv80-master-v6-final.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - name: Build 5 final assets
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          from pathlib import Path
          src=Path('2026-09/gv80-hybrid-master-v6/master-source.jpg')
          out=Path('2026-09/gv80-hybrid-master-v6-final')
          out.mkdir(parents=True,exist_ok=True)
          img=Image.open(src).convert('RGB')
          W,H=img.size
          crops={
            '01-homefeed.jpg':(0,0,W,int(H*0.36)),
            '02-launch.jpg':(0,int(H*0.35),int(W*0.51),int(H*0.68)),
            '03-price.jpg':(int(W*0.49),int(H*0.35),W,int(H*0.68)),
            '04-efficiency.jpg':(0,int(H*0.66),int(W*0.51),H),
            '05-specs.jpg':(int(W*0.49),int(H*0.66),W,H),
          }
          for name,box in crops.items():
            c=img.crop(box)
            bg=ImageOps.fit(c,(1600,900),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
            bg=ImageEnhance.Brightness(bg).enhance(0.55)
            fg=c.copy(); fg.thumbnail((1540,860),Image.Resampling.LANCZOS)
            bg.paste(fg,((1600-fg.width)//2,(900-fg.height)//2))
            bg.save(out/name,'JPEG',quality=94,optimize=True,progressive=True)
          PY
      - name: Commit final assets
        shell: bash
        run: |
          git config user.name 'qltlf001-creator'
          git config user.email 'qltlf001@gmail.com'
          git add 2026-09/gv80-hybrid-master-v6-final
          git rm -f _trigger/gv80-master-v6-final.txt
          git commit -m 'Publish GV80 master v6 final assets'
          git push
