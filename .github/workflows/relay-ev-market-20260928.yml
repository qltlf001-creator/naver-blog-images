        run: |
          set -euo pipefail
          mkdir -p /tmp/ev-market 2026-09/ev-market-20260928
          curl --fail --location --silent --show-error 'https://ucd5c6379157c12285004fa0dda7.dl.dropboxusercontent.com/cd/0/get/DI_QmXSZBuLHRsXxNfPAuBlvD0-Sx7-JErPsdY90hmIUwxk9vpE8xlQGGI3jXDmNAj07gSqTH5WcV_YPXQlzIRhRPDBHhsV1jBkTzdluCfyeAVTDAYJ0pqesySex5X-7iFmFPgxvDbNDWhrVhRPsjDvQZo5XtrarLti3v4PalydFHQ/file?c_luid=3565984f' -o /tmp/ev-market/01-homefeed.png
