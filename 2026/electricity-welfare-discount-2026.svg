<text x="108" y="306" font-size="22" fill="#cfe6ff">한눈에 보는 핵심</text><text x="108" y="344" font-size="27" font-weight="700" fill="#fff">자격에 따라 정액 한도 또는 전기요금의 30% 할인</text>
<text x="72" y="430" font-size="30" font-weight="800">누가 얼마나 할인받나요?</text>
