<rect x="72" y="1170" width="936" height="92" rx="20" fill="#e8f1fb"/>
<text x="100" y="1208" font-size="20" font-weight="700" fill="#244d75">신청 전 확인하세요</text><text x="100" y="1240" font-size="18" fill="#425c73">급여 종류·자격 세부조건·증빙서류에 따라 적용이 달라질 수 있습니다.</text>
<text x="72" y="1304" font-size="16" fill="#536b82">출처: 정부24 ‘전기 요금 복지할인’ (2026.08.14 수정 안내) · 내용 확인일 2026.11.06</text>
