<rect x="584" y="487" width="10" height="140" rx="5" fill="#20a17a"/><text x="618" y="516" font-size="23" font-weight="700">주거·교육급여 수급자</text><text x="618" y="565" font-size="30" font-weight="800" fill="#147b5c">월 최대 10,000원</text><text x="618" y="605" font-size="20" fill="#536b82">여름철 최대 12,000원</text>
<rect x="98" y="706" width="10" height="140" rx="5" fill="#f0a429"/><text x="132" y="735" font-size="23" font-weight="700">해당 차상위계층</text><text x="132" y="784" font-size="30" font-weight="800" fill="#a86600">월 최대 8,000원</text><text x="132" y="824" font-size="20" fill="#536b82">여름철 최대 10,000원</text>
<rect x="584" y="706" width="10" height="140" rx="5" fill="#8464c7"/><text x="618" y="735" font-size="23" font-weight="700">다자녀·대가족·출산 가구</text><text x="618" y="784" font-size="30" font-weight="800" fill="#6746aa">전기요금의 30%</text><text x="618" y="824" font-size="20" fill="#536b82">월 최대 16,000원</text>
