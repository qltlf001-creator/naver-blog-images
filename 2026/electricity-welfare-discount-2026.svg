<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">2026 전기요금 복지할인 한눈에 보기</title><desc id="desc">정부24 2026년 8월 14일 수정 안내 기준의 대상별 전기요금 복지할인 한도와 신청 경로를 정리한 자체 제작 인포그래픽입니다.</desc>
